spring.application.name=rutasegura

# Configuración del Servidor
server.port=8080

# Configuración de Base de Datos PostgreSQL (Supabase)
# Permite inyección mediante variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rutasegura}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JSON Web Tokens (JJWT)
# Clave HMAC-SHA256 codificada en Base64/Hexadecimal (256 bits)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tiempo de expiración del token en milisegundos (24 horas por defecto)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
