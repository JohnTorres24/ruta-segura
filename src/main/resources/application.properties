spring.application.name=rutasegura

# Configuración del Servidor (Render inyecta dinámicamente la variable PORT)
server.port=${PORT:8080}

# Configuración de Base de Datos PostgreSQL (Supabase)
# Compatible con variables estándar de Spring Boot y variables personalizadas en Render
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.uvssdivioksbcclsnkas}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:auE2x6a5Ea6GzVA9}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JSON Web Tokens (JJWT)
# Clave HMAC-SHA256 (256 bits)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tiempo de expiración del token en milisegundos (24 horas)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
